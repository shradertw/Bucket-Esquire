<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bucket, Esquire</title>
<style>
  :root {
    --bg: #f4ede1;
    --ink: #2b2620;
    --muted: #6d6458;
    --panel: #fffaf2;
    --line: #d9ccb6;
    --accent: #3d6fa5;
    --accent-ink: #ffffff;
    --good: #2f7d4f;
    --bad: #b5402f;
    --sel: #ffe9a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 12px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 4px 0; letter-spacing: .5px; }
  .stats { color: var(--muted); font-size: 14px; }
  #scene { width: 100%; height: auto; display: block; border-radius: 10px; border: 2px solid var(--line); background: #e9dcc6; }
  .charge {
    margin: 10px 0 6px; padding: 10px 12px; background: var(--panel);
    border: 2px solid var(--line); border-radius: 10px; font-weight: 600;
  }
  .charge small { display: block; font-weight: 400; color: var(--muted); }
  .patience { font-size: 14px; color: var(--muted); margin-left: auto; }
  .patience b { color: var(--bad); letter-spacing: 2px; }
  #dialog {
    margin: 8px 0; padding: 10px 12px; background: #2b2620; color: #fdf6e8;
    border-radius: 10px; min-height: 92px; display: none; cursor: pointer;
  }
  #dialog .who { font-weight: 700; color: #ffd76a; font-size: 14px; }
  #dialog .say { margin: 2px 0 6px; }
  #dialog .next { font-size: 13px; color: #c9bfae; text-align: right; }
  #panel { margin-top: 8px; }
  #panel.locked { opacity: .45; pointer-events: none; }
  .box { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .box h3 { margin: 0 0 6px; font-size: 15px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .list { display: grid; gap: 6px; }
  .opt {
    text-align: left; width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 2px solid var(--line); background: #fff; color: var(--ink); font: inherit; cursor: pointer;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.sel { background: var(--sel); border-color: #d9a400; }
  .opt.struck { text-decoration: line-through; color: var(--muted); background: #f0ebe2; cursor: default; }
  .opt.wrong { border-color: var(--bad); }
  .card .t { font-weight: 700; font-size: 14px; }
  .card .d { font-size: 14px; }
  .evgrid { display: grid; gap: 6px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .evgrid { grid-template-columns: 1fr; } }
  .static { cursor: default; }
  .static:hover { border-color: var(--line); }
  .q { margin-bottom: 10px; }
  .q .qt { font-weight: 600; margin-bottom: 4px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row .opt { width: auto; flex: 1 1 160px; }
  .big {
    display: block; width: 100%; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink); font: 700 17px/1 inherit; font-family: inherit;
    cursor: pointer; letter-spacing: .5px;
  }
  .big:disabled { opacity: .4; cursor: default; }
  #overlay {
    position: fixed; inset: 0; background: rgba(30,25,20,.6); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  #overlay .card2 {
    background: var(--panel); border-radius: 14px; padding: 22px; max-width: 420px; width: 100%; text-align: center;
  }
  #overlay h2 { margin: 0 0 6px; font-size: 32px; }
  #overlay p { margin: 0 0 16px; }
  .guilty { color: var(--bad); }
  .notguilty { color: var(--good); }
  .title-screen { text-align: center; padding: 10px 0; }
  .title-screen p { max-width: 480px; margin: 8px auto 16px; }
  .talking { animation: bob .45s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes bob { from { transform: translateY(0) } to { transform: translateY(-4px) } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bucket, Esquire</h1>
    <div class="stats" id="stats"></div>
  </header>
  <svg id="scene" viewBox="0 0 400 230" role="img" aria-label="Courtroom"></svg>
  <div id="main"></div>
</div>
<div id="overlay"><div class="card2" id="overlayCard"></div></div>

<script>
/* ---------- helpers ---------- */
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------- word lists ---------- */
const NAMES = ['Abe','Bea','Carl','Cora','Dot','Edna','Frank','Fern','Gus','Hank','Hazel','Ida','Jo','Ken','Kip','Lou','Mabel','Marv','Mort','Ned','Opal','Pip','Pearl','Polly','Ruth','Sal','Stan','Tess','Toby','Walt','Wendy','Clem','Wilma','Mo','Tina'];
const TARGETS = ['Mop','Broom','Lamp','Sock','Rolling Pin','Toothbrush','Ladle','Whisk','Sponge','Stapler','Remote','Teaspoon','Doormat','Oven Mitt'];
const PVERBS = ['insulted','pickpocketed','pranked','tripped','ghosted','sneezed on','short-changed','scared','ate the leftovers of'];
// Charges only a tool with the matching tag can be accused of. p: done to someone; l: done in a room.
const TAG_CHARGES = {
  liquid:   { p: ['spilled soup on'] },
  stirs:    { p: ['stirred up trouble with'] },
  scoops:   { p: ['took the last scoop of ice cream from'] },
  serves:   { p: ['served undersized portions to'] },
  pokes:    { p: ['poked'] },
  beats:    { p: ['egged on'], l: ['whipped up a scandal'] },
  flips:    { p: ['flipped on'] },
  spreads:  { p: ['spread rumors about'] },
  breakable:{ l: ['left sharp chips all over the floor'] },
  hot:      { p: ['burned'] },
  boils:    { l: ['boiled over'] },
  whistles: { p: ['whistled at'] },
  holes:    { l: ['dripped everywhere'] },
  digs:     { p: ['dug up dirt on'], l: ['dug a hole'] },
  rock:     { l: ['chipped the floor tiles'] },
  breaks:   { l: ['broke a window'] },
  gathers:  { l: ['left piles of leaves'] },
  waters:   { p: ['sprayed'], l: ['overwatered the plants'] },
  hits:     { p: ['pounded on the door of'] },
  turns:    { p: ['loosened the bolts on the bike of'] },
  screws:   { p: ['screwed over'] },
  cuts:     { p: ['cut in line in front of'] },
  teeth:    { l: ['chewed up the baseboards'] },
  unclogs:  { l: ['flooded the sink'] },
  sweeps:   { l: ['swept dirt under the rug'] },
  absorbs:  { p: ['soaked'] },
  scrubs:   { l: ['scrubbed the paint off the wall'] },
  electric: { l: ['blew a fuse'] },
  grates:   { p: ['grated on the nerves of'] },
  presses:  { l: ['flattened the flower beds'] },
  weeds:    { l: ['pulled up the tulips'] },
  grips:    { p: ['pinched'] }
};
// Half the time (when one exists), the charge comes from the client's own tags.
function chargeVerb(tool, person) {
  const key = person ? 'p' : 'l';
  const pool = TOOLS[tool].tags.flatMap(t => (TAG_CHARGES[t] && TAG_CHARGES[t][key]) || []);
  return pool.length && Math.random() < 0.5 ? rand(pool) : rand(person ? PVERBS : LVERBS);
}
const LVERBS = ['littered','loitered','trespassed','made a huge mess','threw a loud party','left the faucet running','sang off-key','tracked dirt'];
const ROOMS = [
  { name: 'kitchen', landmark: 'the refrigerator' },
  { name: 'garage', landmark: 'the lawnmower' },
  { name: 'laundry room', landmark: 'the washing machine' },
  { name: 'pantry', landmark: 'a shelf of canned beans' },
  { name: 'backyard', landmark: 'the garden hose' },
  { name: 'attic', landmark: 'a box labeled "XMAS?"' },
  { name: 'bathroom', landmark: 'the bathtub' },
  { name: 'living room', landmark: 'the couch' },
  { name: 'basement', landmark: 'the water heater' }
];
const RESIDUES = [
  { sub: 'flour', act: 'baking cookies' },
  { sub: 'motor grease', act: 'fixing the car' },
  { sub: 'blue paint', act: 'painting the fence' },
  { sub: 'mud', act: 'gardening' },
  { sub: 'glitter', act: 'making a birthday card' },
  { sub: 'sawdust', act: 'building a birdhouse' },
  { sub: 'soap suds', act: 'washing the dishes' }
];
const HOURS = ['7:15 PM','9:40 AM','noon','midnight','3:30 PM','6:05 AM','8:45 PM','11:20 AM'];
const DECOYS = [
  { title: 'Coupon', text: '10% off grout. Expired last March.' },
  { title: 'Grocery List', text: 'Eggs, milk, AA batteries, paper towels.' },
  { title: 'Photo of a Cloud', text: 'A photograph of a cloud. Undated.' },
  { title: 'Bus Schedule', text: 'Route 14. Weekdays only.' }
];

/* ---------- character drawing ---------- */
const HAIRC = ['#3b2a1e','#7a4a22','#d9a441','#c94f2b','#222222','#9a9a9a','#e8e8e8','#5b3fa0'];
const BODYC = ['#d9534f','#4a90c2','#5cb85c','#e8a33d','#8e6bbf','#e07aa8','#3fb3a8','#c8b560'];
const MET = '#c3cad1', STEEL = '#8c96a0', WOOD = '#a5713f', CREAM = '#f6f2ea';

// Optional `variants` are alternate body shapes (same tags), picked at random per character.
// Dialogue lines and charges are only ever chosen from tags a tool actually has.
const TOOLS = {
  /* kitchen utensils */
  spoon:   { label: 'Spoon', tags: ['utensil','metal','liquid','stirs','scoops','milk'], face: { x: 50, y: 38, r: 14 }, hair: { x: 50, y: 10, w: 16 },
    draw: c => `<rect x="46" y="62" width="8" height="78" rx="4" fill="${c}"/><ellipse cx="50" cy="38" rx="22" ry="30" fill="${MET}"/>`,
    variants: [{ face: { x: 50, y: 40, r: 16 }, hair: { x: 50, y: 14, w: 18 },
      draw: c => `<rect x="46" y="62" width="8" height="78" rx="4" fill="${c}"/><circle cx="50" cy="40" r="28" fill="${MET}"/>` }] },

  ladle:   { label: 'Ladle', tags: ['utensil','liquid','scoops','serves','deep','handle'], face: { x: 50, y: 112, r: 16 }, hair: { x: 50, y: 90, w: 26 },
    draw: c => `<path d="M50 92 L50 14 Q50 4 40 6" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M16 90 Q16 138 50 138 Q84 138 84 90 Z" fill="${MET}"/>` },
  whisk:   { label: 'Whisk', tags: ['utensil','metal','beats','wires'], face: { x: 50, y: 52, r: 12 }, hair: { x: 50, y: 12, w: 14 },
    draw: c => `${[26,17,8].map(rx => `<ellipse cx="50" cy="52" rx="${rx}" ry="42" fill="none" stroke="${MET}" stroke-width="3"/>`).join('')}<rect x="44" y="90" width="12" height="50" rx="5" fill="${c}"/>` },
  spatula: { label: 'Spatula', tags: ['utensil','flips','flat'], face: { x: 50, y: 32, r: 15 }, hair: { x: 50, y: 10, w: 22 },
    draw: c => `<rect x="46" y="70" width="8" height="70" rx="3" fill="#333"/><rect x="24" y="10" width="52" height="64" rx="10" fill="${c}"/><rect x="34" y="52" width="5" height="16" rx="2" fill="#0003"/><rect x="47.5" y="52" width="5" height="16" rx="2" fill="#0003"/><rect x="61" y="52" width="5" height="16" rx="2" fill="#0003"/>` },
  knife:   { label: 'Butter Knife', tags: ['utensil','metal','spreads','dull','flat'], face: { x: 50, y: 48, r: 10 }, hair: { x: 50, y: 10, w: 10 },
    draw: c => `<path d="M38 84 L38 24 Q40 6 62 8 L62 84 Z" fill="${MET}"/><rect x="42" y="80" width="16" height="60" rx="6" fill="${c}"/>` },
  rollingpin: { label: 'Rolling Pin', tags: ['utensil','presses','handle'], face: { x: 50, y: 70, r: 15 }, hair: { x: 50, y: 26, w: 18 },
    draw: c => `<rect x="44" y="4" width="12" height="24" rx="5" fill="${c}"/><rect x="44" y="112" width="12" height="26" rx="5" fill="${c}"/><rect x="28" y="24" width="44" height="92" rx="12" fill="#d9a86c"/>` },
  tongs:   { label: 'Tongs', tags: ['utensil','grips','metal'], face: { x: 50, y: 30, r: 14 }, hair: { x: 50, y: 12, w: 14 },
    draw: c => `<path d="M42 30 L28 136 L37 138 L50 34 Z" fill="${MET}"/><path d="M58 30 L72 136 L63 138 L50 34 Z" fill="${MET}"/><circle cx="50" cy="30" r="19" fill="${c}"/>` },
  grater:  { label: 'Cheese Grater', tags: ['utensil','grates','sharp','holes','metal'], face: { x: 50, y: 70, r: 15 }, hair: { x: 50, y: 30, w: 20 },
    draw: c => `<path d="M36 32 Q50 6 64 32" stroke="${c}" stroke-width="6" fill="none"/><path d="M24 30 L76 30 L86 138 L14 138 Z" fill="${MET}"/>${[0,1,2].map(r => [0,1,2,3].map(k => `<rect x="${30 + k * 11 - r * 2}" y="${100 + r * 11}" width="6" height="3" rx="1" fill="#0004"/>`).join('')).join('')}` },
  /* dishes & cookware */
  plate:   { label: 'Plate', tags: ['dish','flat','breakable','serves','ceramic'], face: { x: 50, y: 92, r: 18 }, hair: { x: 50, y: 52, w: 26 },
    draw: c => `<circle cx="50" cy="94" r="44" fill="${CREAM}" stroke="${c}" stroke-width="7"/><circle cx="50" cy="94" r="30" fill="none" stroke="#0001" stroke-width="2"/>`,

      draw: c => `<rect x="8" y="54" width="84" height="84" rx="16" fill="${CREAM}" stroke="${c}" stroke-width="7"/><rect x="22" y="68" width="56" height="56" rx="10" fill="none" stroke="#0001" stroke-width="2"/>` }] },
  bowl:    { label: 'Bowl', tags: ['dish','liquid','deep','breakable','ceramic','milk'], face: { x: 50, y: 108, r: 16 }, hair: { x: 50, y: 80, w: 30 },
    draw: c => `<path d="M8 84 L92 84 Q90 138 50 138 Q10 138 8 84 Z" fill="${c}"/><ellipse cx="50" cy="84" rx="42" ry="7" fill="#0002"/>`,

      draw: c => `<path d="M2 98 L98 98 Q94 138 50 138 Q6 138 2 98 Z" fill="${c}"/><ellipse cx="50" cy="98" rx="48" ry="7" fill="#0002"/>` }] },

    draw: c => `<path d="M74 80 Q96 80 96 100 Q96 120 74 120" stroke="${c}" stroke-width="8" fill="none"/><rect x="20" y="62" width="56" height="76" rx="8" fill="${c}"/><rect x="20" y="62" width="56" height="7" rx="3" fill="#fff5"/>`,
    variants: [{ face: { x: 48, y: 92, r: 15 }, hair: { x: 48, y: 44, w: 20 },
      draw: c => `<path d="M70 62 Q92 62 92 84 Q92 106 70 106" stroke="${c}" stroke-width="8" fill="none"/><rect x="24" y="44" width="48" height="94" rx="8" fill="${c}"/><rect x="24" y="44" width="48" height="7" rx="3" fill="#fff5"/>` }] },

    draw: c => `<ellipse cx="50" cy="134" rx="42" ry="6" fill="${CREAM}" stroke="${c}" stroke-width="2"/><path d="M78 92 Q98 94 92 110 Q88 118 76 116" stroke="${c}" stroke-width="6" fill="none"/><path d="M18 84 L82 84 Q80 132 50 132 Q20 132 18 84 Z" fill="${c}"/>` },

  saucepan:{ label: 'Saucepan', tags: ['cookware','hot','liquid','boils','handle','metal'], face: { x: 42, y: 110, r: 16 }, hair: { x: 42, y: 78, w: 24 },
    draw: c => `<rect x="72" y="90" width="28" height="8" rx="3" fill="#333"/><rect x="10" y="80" width="64" height="58" rx="6" fill="${c}"/><rect x="8" y="76" width="68" height="8" rx="3" fill="#0003"/>` },
  pot:     { label: 'Pot', tags: ['cookware','hot','liquid','boils','deep','metal'], face: { x: 50, y: 104, r: 17 }, hair: { x: 50, y: 58, w: 20 },
    draw: c => `<rect x="2" y="82" width="16" height="8" rx="3" fill="#333"/><rect x="82" y="82" width="16" height="8" rx="3" fill="#333"/><rect x="14" y="70" width="72" height="68" rx="6" fill="${c}"/><ellipse cx="50" cy="70" rx="38" ry="8" fill="#555"/><circle cx="50" cy="61" r="5" fill="#333"/>`,

    draw: c => `<rect x="46" y="40" width="8" height="100" rx="3" fill="${WOOD}"/><path d="M4 46 Q50 0 96 46 L84 48 Q50 22 16 48 Z" fill="${STEEL}"/><circle cx="50" cy="34" r="16" fill="${c}"/>` },

/* ---------- hair & hats ---------- */
function drawHair(style, h, hc) {
  const { x, y, w } = h;
  switch (style) {
    case 'tuft': return `<path d="M${x} ${y} q-4 -10 -9 -8 M${x} ${y} q0 -12 2 -13 M${x} ${y} q4 -10 9 -7" stroke="${hc}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
    case 'bowl': return `<path d="M${x - w} ${y + 5} Q${x} ${y - w * 0.9} ${x + w} ${y + 5} Z" fill="${hc}"/>`;
    case 'spiky': {
      const pts = []; const n = 5; const L = x - w * 0.8, R = x + w * 0.8;
      for (let i = 0; i <= n * 2; i++) { const px = L + (R - L) * i / (n * 2); pts.push(`${px},${i % 2 ? y - 10 : y + 3}`); }
      return `<polygon points="${pts.join(' ')}" fill="${hc}"/>`;
    }
    case 'curly': { let s = ''; for (let i = -2; i <= 2; i++) s += `<circle cx="${x + i * w * 0.38}" cy="${y - 1 - (Math.abs(i) === 2 ? -3 : 0)}" r="${w * 0.27}" fill="${hc}"/>`; return s; }
    case 'mohawk': return `<path d="M${x - 4} ${y + 3} L${x - 3} ${y - 14} L${x + 3} ${y - 17} L${x + 4} ${y + 3} Z" fill="${hc}"/>`;
    case 'part': return `<path d="M${x - w} ${y + 6} Q${x - w} ${y - 6} ${x - w * 0.2} ${y - 5} L${x - w * 0.1} ${y + 2} L${x} ${y - 6} Q${x + w} ${y - 6} ${x + w} ${y + 6} Z" fill="${hc}"/>`;
    case 'bun': return `<path d="M${x - w * 0.8} ${y + 4} Q${x} ${y - w * 0.6} ${x + w * 0.8} ${y + 4} Z" fill="${hc}"/><circle cx="${x}" cy="${y - w * 0.45}" r="${Math.max(4, w * 0.3)}" fill="${hc}"/>`;
    default: return '';
  }
}
function drawHat(hat, h) {

/* ---------- face parts ---------- */
// All parts are drawn relative to the face anchor (x, y, r); side is -1 (left eye) or 1 (right eye).
function drawEye(kind, ex, ey, r, side, sw) {
  const dark = '#222';
  switch (kind) {
    case 'beady': return `<circle cx="${ex}" cy="${ey}" r="${r * 0.07}" fill="${dark}"/>`;
    case 'oval': return `<ellipse cx="${ex}" cy="${ey}" rx="${r * 0.09}" ry="${r * 0.15}" fill="${dark}"/>`;
    case 'wide': return `<circle cx="${ex}" cy="${ey}" r="${r * 0.18}" fill="#fff" stroke="${dark}" stroke-width="1.2"/><circle cx="${ex}" cy="${ey}" r="${r * 0.08}" fill="${dark}"/>`;
    case 'glance': return `<circle cx="${ex}" cy="${ey}" r="${r * 0.17}" fill="#fff" stroke="${dark}" stroke-width="1.2"/><circle cx="${ex + r * 0.08}" cy="${ey}" r="${r * 0.07}" fill="${dark}"/>`;
    case 'tiny': return `<circle cx="${ex}" cy="${ey}" r="${r * 0.19}" fill="#fff" stroke="${dark}" stroke-width="1.2"/><circle cx="${ex}" cy="${ey}" r="${r * 0.04}" fill="${dark}"/>`;
    case 'lashes': return `<circle cx="${ex}" cy="${ey}" r="${r * 0.11}" fill="${dark}"/><path d="M${ex + side * r * 0.07} ${ey - r * 0.08} L${ex + side * r * 0.19} ${ey - r * 0.18}" stroke="${dark}" stroke-width="${sw * 0.7}" stroke-linecap="round"/>`;
    case 'sleepy': return `<path d="M${ex - r * 0.14} ${ey} Q${ex} ${ey + r * 0.08} ${ex + r * 0.14} ${ey}" stroke="${dark}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
    case 'happy': return `<path d="M${ex - r * 0.14} ${ey + r * 0.04} Q${ex} ${ey - r * 0.14} ${ex + r * 0.14} ${ey + r * 0.04}" stroke="${dark}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
    case 'shut': return `<path d="M${ex - r * 0.14} ${ey} L${ex + r * 0.14} ${ey}" stroke="${dark}" stroke-width="${sw}" stroke-linecap="round"/>`;
    case 'narrow': return `<circle cx="${ex}" cy="${ey + r * 0.03}" r="${r * 0.09}" fill="${dark}"/><path d="M${ex - r * 0.17} ${ey - r * 0.04} L${ex + r * 0.17} ${ey - r * 0.04}" stroke="${dark}" stroke-width="${sw}" stroke-linecap="round"/>`;
    case 'wince': { const a = ex - side * r * 0.12, b = ex + side * r * 0.1; return `<path d="M${a} ${ey - r * 0.1} L${b} ${ey} L${a} ${ey + r * 0.1}" stroke="${dark}" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`; }
    case 'teary': return `<circle cx="${ex}" cy="${ey}" r="${r * 0.11}" fill="${dark}"/>${drop(ex + side * r * 0.04, ey + r * 0.14, r * 0.6)}`;
    default: return `<circle cx="${ex}" cy="${ey}" r="${r * 0.11}" fill="${dark}"/>`; // dots
  }
}
function drop(x, y, r) { return `<path d="M${x} ${y} Q${x + r * 0.13} ${y + r * 0.22} ${x} ${y + r * 0.27} Q${x - r * 0.13} ${y + r * 0.22} ${x} ${y} Z" fill="#7fc8f8"/>`; }
function drawBrows(kind, x, ey, dx, r, sw) {

  if (kind === 'unibrow') return `<path d="M${x - dx - r * 0.2} ${by} Q${x} ${by - r * 0.06} ${x + dx + r * 0.2} ${by}" stroke="${dark}" stroke-width="${sw * 1.6}" fill="none" stroke-linecap="round"/>`;
  let s = '';

    const ex = x + side * dx, ix = ex - side * r * 0.16, ox = ex + side * r * 0.18;
    let k = kind; if (k === 'skeptical') k = side === 1 ? 'raised' : 'flat';
    const w = k === 'thick' ? sw * 2.2 : sw;
    const iy = { angry: by + r * 0.1, worried: by - r * 0.1, sad: by - r * 0.06, raised: by - r * 0.08, arched: by }[k] ?? by;
    const oy = { angry: by - r * 0.06, worried: by + r * 0.04, sad: by + r * 0.1, raised: by - r * 0.06, arched: by + r * 0.02 }[k] ?? by;
    if (k === 'raised' || k === 'arched') s += `<path d="M${ox} ${oy} Q${ex} ${Math.min(iy, oy) - r * 0.12} ${ix} ${iy}" stroke="${dark}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
    else s += `<path d="M${ix} ${iy} L${ox} ${oy}" stroke="${dark}" stroke-width="${w}" stroke-linecap="round"/>`;
  }

}

    case 'smirk': return line(`M${x - 0.2 * r} ${my} Q${x + 0.05 * r} ${my + 0.12 * r} ${x + 0.25 * r} ${my - 0.08 * r}`);

    case 'buck': return `<rect x="${x - 0.08 * r}" y="${my + 0.03 * r}" width="${0.16 * r}" height="${0.11 * r}" fill="#fff" stroke="${dark}" stroke-width="0.8"/>` + line(`M${x - 0.25 * r} ${my} Q${x} ${my + 0.08 * r} ${x + 0.25 * r} ${my}`);

// Rest features `f` plus an optional expression (brows/eyes/mouth/fx) that overrides them.
function drawFace(f, fc, hc, expr) {
  const { x, y, r } = fc; const sw = Math.max(1.3, r * 0.1);
  const ey = y - 0.12 * r, dx = 0.38 * r, my = y + 0.55 * r;
  const e = expr || {}; const fx = e.fx || [];
  let s = drawCheeks(f.cheeks, x, y, r);
  if (fx.includes('blush') && f.cheeks !== 'blush') s += drawCheeks('blush', x, y, r);
  s += drawBeard(f.beard, x, y, r, hc);
  for (const side of [-1, 1]) if (!(f.eyewear === 'eyepatch' && side === 1)) s += drawEye(e.eyes || f.eyes, x + side * dx, ey, r, side, sw);
  s += drawBrows(e.brows || f.brows, x, ey, dx, r, sw);
  s += drawMouth(e.mouth || f.mouth, x, my, r, sw);
  s += drawMustache(f.mustache, x, y, r, hc);
  if (fx.includes('sweat')) s += drop(x + 0.82 * r, y - 0.62 * r, r * 1.3);
  s += drawEyewear(f.eyewear, x, ey, dx, r);
  s += drawEars(f.ears, x, y, r);
  s += drawNeck(f.neck, x, y, r);
  return s;
}

}

/* ---------- case generation ---------- */
function makeChar(exclude) {
  const tool = rand(CLIENT_TOOLS.filter(t => t !== exclude));
  const label = TOOLS[tool].label;
  const same = NAMES.filter(n => n[0] === label[0]);
  const name = rand(same.length ? same : NAMES);
  const nv = TOOLS[tool].variants ? TOOLS[tool].variants.length : 0;
  const variant = Math.floor(Math.random() * (nv + 1));
  return { tool, variant, name, label: `${name} the ${label}`, kind: label.toLowerCase(), feat: randFeat() };
}

function genCase(n) {
  const client = makeChar();
  const witness = makeChar(client.tool);
  const [S, P, O] = shuffle(ROOMS);
  const [Rs, Rc, Ro] = shuffle(RESIDUES);
  const hour = rand(HOURS);
  const person = Math.random() < 0.5;
  const target = person ? `${rand(NAMES)} the ${rand(TARGETS)}` : null;
  const charge = person ? `${client.label} ${chargeVerb(client.tool, true)} ${target}.` : `${client.label} ${chargeVerb(client.tool, false)} in the ${S.name}.`;
  const mode = Math.random() < 0.5 ? 'lies' : 'story';
  const cn = client.name;

  const ev = {
    place: { id: 'place', title: 'Security Photo', text: `A blurry photo of ${cn} standing next to ${P.landmark}. Timestamp: ${hour}.` },
    residue: { id: 'residue', title: 'Lab Report', text: `Swab of ${cn}: traces of ${Rc.sub}. No other substances found.` },
    motive: person
      ? { id: 'motive', title: 'Birthday Card', text: `From ${cn} to ${target}: "You are my favorite. Happy birthday." There is a small drawn heart.` }
      : { id: 'motive', title: 'Diary Page', text: `From ${cn}'s diary: "The ${S.name} is too spooky. I never go in there."` },
    decoy: Object.assign({ id: 'decoy' }, rand(DECOYS))
  };
  const evidence = shuffle([ev.place, ev.residue, ev.motive, ev.decoy]);

  const c = { n, client, witness, S, P, O, Rs, Rc, Ro, hour, person, target, charge, mode, ev, evidence };

  if (mode === 'lies') {
    const dims = shuffle(['place', 'residue', 'motive']);
    const nLies = Math.random() < 0.5 ? 2 : 3;
    const lieSet = new Set(dims.slice(0, nLies));
    const say = {
      place: [`I saw ${cn} in the ${S.name} at ${hour}. Clear as day.`, `Around ${hour}, I think I saw ${cn} over by ${P.landmark}.`],
      residue: [`${cn} was covered in ${Rs.sub}. Same as the crime scene. Suspicious.`, `${cn} had a little ${Rc.sub} on them. I did not think much of it.`],
      motive: person
        ? [`Everyone knows ${cn} cannot stand ${target}.`, `${cn} and ${target} seem like good pals, honestly.`]
        : [`${cn} loves the ${S.name}. Goes in there all the time.`, `${cn} does not like the ${S.name}. Says it is spooky.`]
    };
    const stmts = shuffle(dims).map(d => ({ dim: d, lie: lieSet.has(d), text: say[d][lieSet.has(d) ? 0 : 1] }));
    stmts.unshift({ dim: 'fact', lie: false, text: `It all happened in the ${S.name}, at ${hour}.` });
    stmts.push({ dim: 'fact2', lie: false, text: `Afterward, the ${S.name} was covered in ${Rs.sub}.` });
    c.stmts = stmts; c.nLies = nLies;
  } else {
    c.questions = [
      { dim: 'place', q: `Where were you at ${hour}?`, opts: shuffle([P, S, O]).map(r => ({ text: `In the ${r.name}.`, ok: r === P, key: r.name })) },
      { dim: 'residue', q: `What were you doing at the time?`, opts: shuffle([Rc, Rs, Ro]).map(r => ({ text: `${cap(r.act)}.`, ok: r === Rc, key: r.act })) },
      { dim: 'motive', q: person ? `How do you feel about ${target}?` : `How do you feel about the ${S.name}?`,
        opts: shuffle(person
          ? [{ text: 'We are close friends.', ok: true }, { text: 'I find them very annoying.', ok: false }, { text: 'Who? Never met them.', ok: false }]
          : [{ text: 'It is spooky. I stay out.', ok: true }, { text: 'It is my favorite room.', ok: false }, { text: 'I go in there every day.', ok: false }]) }
    ];
  }
  return c;
}

function tagsOf(who) {
  if (CAST_TAGS[who]) return CAST_TAGS[who];
  const c = game.case;
  return TOOLS[(who === 'client' ? c.client : c.witness).tool].tags;
}
// Tag lines a speaker with these tags is allowed to say for a moment.
function tagLinesFor(moment, tags) {
  const t = LINES[moment].tags; let out = [];
  for (const tag of tags) if (t[tag]) out = out.concat(t[tag]);
  return out;
}
function pickLine(moment, tags) {
  const tl = tagLinesFor(moment, tags);
  return tl.length && Math.random() < TAG_LINE_CHANCE ? rand(tl) : rand(LINES[moment].plain);
}
// A dialogue line from a speaker, chosen with that speaker's own tags.
// Speaker emotion options and listener reactions for each moment.
const MOMENT_EMO = {
  clientOpen:     [['nervous', 'sad', 'scared', 'nervous'], {}],
  witnessOpen:    [['confident', 'smug', 'neutral'], { client: 'nervous' }],
  witnessCaught:  [['embarrassed', 'nervous', 'scared', 'sad'], { pros: 'angry', client: 'relieved' }],
  judgeOpen:      [['stern', 'neutral'], {}],
  sustained:      [['stern'], { witness: 'scared', pros: 'angry', client: 'happy' }],
  judgeLiesWin:   [['stern'], { client: 'relieved', pros: 'sad', witness: 'embarrassed' }],
  judgeStoryWin:  [['stern', 'neutral'], { client: 'relieved', pros: 'sad' }],

  prosAgrees:     [['smug'], { bucket: 'embarrassed', witness: 'smug' }],
  bucketReady:    [['confident', 'neutral'], { client: 'relieved' }],

  bucketStoryFix: [['embarrassed', 'nervous'], { client: 'embarrassed', pros: 'smug' }]

// Individual lines whose tone differs from their moment's usual emotion.
const LINE_EMO = {
  'I bristle at the accusation, Your Honor.': 'angry',
  'Someone is trying to dig up dirt on me.': 'angry',
  'I feel like I am being screwed over, Your Honor.': 'angry',
  'I have been gritting my teeth through this whole thing.': 'angry',
  'Please be gentle. I chip easily.': 'scared',
  'I have nothing to hide. You can see right through me.': 'confident',
  'I have been solid as a rock my whole life.': 'confident',
  'I am sharper than people think. I would not be this careless.': 'confident',
  'My record is spotless.': 'confident',
  'I made that up.': 'embarrassed',
  'Fine. It did not pan out the way I said.': 'angry',
  'Withdrawn.': 'embarrassed'
};
// A dialogue line from a speaker: text chosen with their own tags, plus emotion and listener reactions.
function say(who, moment) {
  const text = pickLine(moment, tagsOf(who));
  const [emos, react] = MOMENT_EMO[moment];
  return [who, text, LINE_EMO[text] || rand(emos), react];
}

// Rare overt puns, each keyed to the tags of whoever it is about. At most one per case.
const has = (who, tag) => tagsOf(who).includes(tag);
const RARE = [

    ['bucket', 'I am familiar with holding water, Mr. Spade.', 'stern'],

    ['judge', 'Ms. Bucket, please get to the point.', 'stern'],
    ['client', 'I am right here.', 'surprised'],
    ['judge', 'Not you.', 'stern']] },

    ['bucket', 'The witness tried to sweep that under the rug.', 'confident'],

    ['judge', 'Strike it from the record.', 'stern']] },

    ['judge', 'Mr. Spade, you are digging yourself a hole.', 'stern'],

    ['client', 'Please do not bring that up.', 'embarrassed'],
    ['judge', 'Mr. Spade.', 'stern']] },
  { site: 'storyFail', chance: 0.3, when: () => has('client', 'flips'), lines: c => [
    ['pros', `${c.client.name} has flipped their story, Your Honor.`, 'smug'],
    ['client', 'It is the only thing I know how to do.', 'sad'],
    ['judge', 'Not in my courtroom.', 'stern']] }

// Returns an exchange for this moment, or null. Uses up the case's one overt pun.
function rarePun(site) {
  if (game.punUsed) return null;
  const c = game.case;
  for (const r of shuffle(RARE.filter(r => r.site === site && r.when(c)))) {
    if (Math.random() < r.chance) { game.punUsed = true; return r.lines(c); }
  }
  return null;
}

const SPEAKERS = { judge: ['Judge Iron', 'char-judge'], pros: ['Prosecutor Spade', 'char-pros'], bucket: ['Ms. Bucket', 'char-bucket'] };
function who(k) {
  const c = game.case;
  if (SPEAKERS[k]) return SPEAKERS[k];
  if (k === 'client') return [c.client.label, 'char-client'];
  if (k === 'witness') return [c.witness.label, 'char-witness'];
  return [k, null];
}
function talk(lines, done) {
  const box = document.getElementById('dialog'); const panel = document.getElementById('panel');
  let i = 0;
  if (panel) panel.classList.add('locked');
  box.style.display = 'block';
  const show = () => {
    if (i >= lines.length) {
      box.style.display = 'none'; box.onclick = null; game.faces = {}; renderScene(); setTalking(null);
      if (panel) panel.classList.remove('locked');
      if (done) done(); return;
    }
    // line = [speaker, text, emotion, { listener: emotion }]
    const [k, text, emo, react] = lines[i]; const [name, id] = who(k);
    const faces = { [k]: makeExpr(emo) };
    for (const [r, e] of Object.entries(react || {})) if (r !== k) faces[r] = makeExpr(e);
    game.faces = faces; renderScene();
    box.innerHTML = `<div class="who">${esc(name)}</div><div class="say">${esc(text)}</div><div class="next">tap to continue ▸</div>`;
    setTalking(id); i++;
  };
  box.onclick = show; show();
}

/* ---------- screens ---------- */
function titleScreen() {
  game.case = null; renderScene(); stats();
  main.innerHTML = `<div class="title-screen box">
    <p>You are Ms. Bucket, attorney at law. Your clients are tools and household items. Defend them using the evidence.</p>
    <button class="big" id="start">Take the first case</button></div>`;
  document.getElementById('start').onclick = startCase;
}

function patienceHtml() {
  return `<span class="patience">Judge's patience: <b>${'●'.repeat(game.patience)}${'○'.repeat(3 - game.patience)}</b></span>`;
}

function startCase() {
  game.caseNo++; game.patience = 3; game.sel = null; game.selEv = null; game.struck = new Set(); game.answers = {}; game.wrongQ = null; game.punUsed = false; game.faces = {};
  const c = game.case = genCase(game.caseNo);
  renderScene(); stats();
  main.innerHTML = `
    <div class="charge"><small>The charge</small>${esc(c.charge)}${c.person ? `<small>Scene: the ${esc(c.S.name)}, at ${esc(c.hour)}</small>` : `<small>Time: ${esc(c.hour)}</small>`}</div>
    <div id="dialog"></div>
    <div id="panel"></div>`;
  renderPanel();
  const intro = [
    say('judge', 'judgeOpen'),
    ['pros', `The defendant, ${c.client.label}, is accused of the following: ${c.charge.replace(/\.$/, '')}. ${pickLine('prosCharge', CAST_TAGS.pros)}`, rand(['smug', 'stern']), { client: 'nervous' }],
    say('client', 'clientOpen'),
    say('bucket', 'bucketReady')
  ];
  intro.push(...(rarePun('intro') || []));
  if (c.mode === 'lies') {
    intro.push(['pros', `The prosecution calls ${c.witness.label} to the stand.`, 'neutral', { witness: 'confident' }]);
    intro.push(say('witness', 'witnessOpen'));
    intro.push(...(rarePun('witnessIntro') || []));
    intro.push(say('bucket', 'bucketLies'));
  } else {
    intro.push(['judge', `The defense may now present ${c.client.name}'s side of the story.`, 'neutral', { client: 'nervous' }]);
    intro.push(say('bucket', 'bucketStory'));
  }
  talk(intro);
}

function renderPanel() {
  const c = game.case; const panel = document.getElementById('panel');

      <div class="box">

        <div class="list">${c.stmts.map((s, i) => `<button class="opt ${game.struck.has(i) ? 'struck' : ''} ${game.sel === i ? 'sel' : ''}" data-s="${i}" ${game.struck.has(i) ? 'disabled' : ''}>“${esc(s.text)}”</button>`).join('')}</div>
      </div>
      <div class="box"><h3>Evidence</h3>

        <div class="row" style="align-items:baseline"><h3>${esc(c.client.name)}'s story</h3>${patienceHtml()}</div>

      </div>

/* ---------- mode A: catch the lies ---------- */
function objectLie() {
  const c = game.case; const s = c.stmts[game.sel]; const e = c.ev[game.selEv] || c.evidence.find(x => x.id === game.selEv);
  const cn = c.client.name;
  const why = {
    place: `This security photo shows ${cn} next to ${c.P.landmark} at ${c.hour}. That is in the ${c.P.name}. My client cannot be in two rooms at once.`,
    residue: `The lab found only ${c.Rc.sub} on ${cn}. There was no ${c.Rs.sub} at all.`,
    motive: c.person
      ? `${cn} gave ${c.target} a birthday card that says "You are my favorite." You do not write that to someone you cannot stand.`
      : `${cn}'s diary says the ${c.S.name} is too spooky to go in. My client does not go in there.`
  };
  if (s.lie && e.id === s.dim) {
    game.struck.add(game.sel); game.sel = null; game.selEv = null;
    const done = game.struck.size >= c.nLies;
    const lines = [
      ['bucket', `Objection! ${why[s.dim]}`, 'confident', { witness: 'scared' }],
      say('judge', 'sustained'),
      say('witness', 'witnessCaught'),
      ...(rarePun('caught') || [])
    ];
    renderPanel();
    if (done) {
      lines.push(...(rarePun('liesWin') || []));
      lines.push(say('pros', 'prosRests'));
      lines.push(say('judge', 'judgeLiesWin'));
      talk(lines, () => verdict(true));
    } else talk(lines);
  } else {
    let lines = [['bucket', `Objection! Please look at the ${e.title.toLowerCase()}.`, 'confident', { witness: 'nervous' }]];
    if (!s.lie && e.id === s.dim) {
      lines.push(say('pros', 'prosAgrees'));
      lines.push(['judge', 'Overruled.', 'stern', { bucket: 'embarrassed', pros: 'smug' }]);
    } else if (e.id === 'decoy') {
      lines.push(['judge', `Overruled. That is a ${e.title.toLowerCase()}. It is not relevant.`, 'stern', { bucket: 'embarrassed', pros: 'smug' }]);
    } else if (!s.lie) {
      lines.push(['judge', 'Overruled. Nothing is wrong with that statement.', 'stern', { bucket: 'embarrassed', pros: 'smug' }]);
    } else {
      lines.push(['judge', 'Overruled. That evidence has nothing to do with that statement.', 'stern', { bucket: 'embarrassed', pros: 'smug' }]);
    }
    lines.push(...(rarePun('objFail') || [say('bucket', 'bucketRetreat')]));
    penalize(lines);
  }
}

/* ---------- mode B: build the story ---------- */
function tellStory() {
  const c = game.case; const cn = c.client.name;
  const wrongIdx = c.questions.findIndex((q, i) => !q.opts[game.answers[i]].ok);
  const story = c.questions.map((q, i) => q.opts[game.answers[i]].text).join(' ');
  if (wrongIdx === -1) {
    talk([
      ['client', story, 'nervous', {}],
      ['pros', 'The prosecution has no objections.', 'sad', { client: 'relieved' }],
      say('judge', 'judgeStoryWin')
    ], () => verdict(true));
    return;
  }
  const q = c.questions[wrongIdx]; const ans = q.opts[game.answers[wrongIdx]];
  game.wrongQ = wrongIdx; renderPanel();
  let why;
  if (q.dim === 'place') why = `The security photo puts ${cn} next to ${c.P.landmark} at ${c.hour}. That is not in the ${ans.key}.`;
  else if (q.dim === 'residue') why = `The lab found ${c.Rc.sub} on ${cn}. ${cap(ans.key)} would not do that.`;
  else why = c.person ? `${cn} wrote "You are my favorite" on a birthday card to ${c.target}. That does not match.` : `${cn}'s own diary says the ${c.S.name} is too spooky. That does not match.`;
  penalize([
    ['client', story, 'nervous', {}],
    ['pros', `Objection! ${why}`, 'smug', { client: 'scared', bucket: 'nervous' }],
    ['judge', 'Sustained. The defense may try again.', 'stern', { client: 'sad' }],
    ...(rarePun('storyFail') || [say('bucket', 'bucketStoryFix')])
  ]);
}

function penalize(lines) {
  game.patience--;
  renderPanel();
  if (game.patience <= 0) {
    lines.push(say('judge', 'judgeDone'));
    talk(lines, () => verdict(false));
  } else talk(lines);
}

/* ---------- verdict ---------- */
function verdict(win) {
  const c = game.case;
  if (win) game.won++; else game.lost++;
  stats();
  game.faces = win
    ? { client: 'happy', bucket: 'happy', pros: 'angry', witness: 'embarrassed' }
    : { client: 'sad', bucket: 'sad', pros: 'smug', witness: 'smug' };
  for (const k in game.faces) game.faces[k] = makeExpr(game.faces[k]);
  renderScene();
  const ov = document.getElementById('overlay'); const card = document.getElementById('overlayCard');
  card.innerHTML = win
    ? `<h2 class="notguilty">NOT GUILTY</h2><p>${esc(c.client.label)} is free to go. Please return to your drawer.</p><button class="big" id="nextCase">Next case</button>`
    : `<h2 class="guilty">GUILTY</h2><p>${esc(c.client.label)} is sentenced to six months on the top shelf.</p><button class="big" id="nextCase">Next case</button>`;
  ov.style.display = 'flex';
  document.getElementById('nextCase').onclick = () => { ov.style.display = 'none'; startCase(); };
}

titleScreen();
</script>
</body>
</html>
